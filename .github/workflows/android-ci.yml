# CI de la app Android (T141, HU-38): en cada push y pull request a main corre lint,
# las pruebas unitarias y el build de debug. Sin app/google-services.json ni local.properties
# (no se versionan) la app compila igual: Firebase queda apagado y las claves usan sus
# valores de relleno, así que el CI no necesita ningún secreto.
name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint + pruebas unitarias + build
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # gradle/gradle-daemon-jvm.properties pide JetBrains 21 para el daemon de Gradle.
      - name: JDK 21 (JetBrains)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: jetbrains
          java-version: "21"

      # El wrapper fija versión y checksum; setup-gradle valida sus JAR y configura caché.
      - name: Preparar Gradle Wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          validate-wrappers: true

      - name: Permiso del wrapper
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Pruebas unitarias
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Verificar que no haya pruebas omitidas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert reports, 'No se generaron resultados de pruebas'
          skipped = sum(int(ET.parse(p).getroot().get('skipped', 0)) for p in reports)
          assert skipped == 0, f'Hay {skipped} pruebas omitidas'
          PY

      # Cobertura de las pruebas unitarias con JaCoCo (T088). Las pruebas ya corrieron arriba, así que Gradle solo
      # junta los datos y genera el reporte. Se publica en el resumen del job y como artefacto; no hay umbral que
      # falle porque casi toda la app es interfaz Compose y la cobertura medida es baja.
      - name: Cobertura (JaCoCo)
        run: |
          ./gradlew :app:createDebugUnitTestCoverageReport --console=plain
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse('app/build/reports/coverage/test/debug/report.xml').getroot()
          print('### Cobertura de las pruebas unitarias (JaCoCo)\n')
          print('| Métrica | Cubierto | Total | % |\n|---|---|---|---|')
          for kind, label in (('LINE', 'Líneas'), ('BRANCH', 'Ramas'), ('METHOD', 'Métodos'), ('CLASS', 'Clases')):
              c = next(x for x in root.findall('counter') if x.get('type') == kind)
              cov, miss = int(c.get('covered')), int(c.get('missed'))
              print(f'| {label} | {cov} | {cov + miss} | {100 * cov / (cov + miss):.1f} % |')
          PY

      - name: Build de debug
        run: ./gradlew :app:assembleDebug --console=plain

      # R8 solo corre en release: sin este paso una regla de proguard-rules.pro rota (o un DTO
      # que R8 renombra) no se vería hasta publicar. La URL es pública y solo se compila.
      - name: Build de release (R8)
        run: ./gradlew :app:assembleRelease -PRELEASE_API_BASE_URL=https://api.urbanblade.com.mx/api/v1/ --console=plain

      - name: Reportes de lint y pruebas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reportes-android
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/coverage/test/debug/
          if-no-files-found: ignore
          retention-days: 14
